<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BSK Pro">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3B6D11">
<title>BSK Prüfprotokoll Pro — Bartoska</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --g:#3B6D11;--gd:#27500A;--gl:#EAF3DE;--gm:#639922;
  --r:#A32D2D;--rl:#FCEBEB;
  --b:#185FA5;--bl:#E6F1FB;
  --am:#854F0B;--aml:#FAEEDA;
  --bg:#fff;--bg2:#F6F5F2;--bg3:#EDECE8;
  --tx:#1a1a1a;--tx2:#555550;--tx3:#888880;
  --br:rgba(0,0,0,0.11);--br2:rgba(0,0,0,0.20);
  --rad:10px;--rads:7px;
  --sb:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1C1C1E;--bg2:#2C2C2E;--bg3:#3A3A3C;
  --tx:#F2F2F7;--tx2:#AEAEB2;--tx3:#6C6C70;
  --br:rgba(255,255,255,0.10);--br2:rgba(255,255,255,0.20);
  --gl:#1A2E0A;--rl:#2C1010;--bl:#0A1F35;--aml:#2A1A05;
  --g:#8FBF50;--gd:#A8D470;--gm:#8FBF50;
}}
html,body{height:100%;overflow:hidden;background:var(--bg2);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--tx);font-size:15px;}
.app{display:flex;flex-direction:column;height:100dvh;max-width:540px;margin:0 auto;background:var(--bg);}

/* HEADER */
.hdr{background:var(--g);color:#fff;padding:13px 14px 11px;flex-shrink:0;display:flex;align-items:center;gap:10px;}
.hdr-back{background:rgba(255,255,255,0.18);border:none;color:#fff;border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;flex-shrink:0;}
.hdr-info{flex:1;min-width:0;}
.hdr-info h1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-info p{font-size:11px;opacity:0.8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-add{background:rgba(255,255,255,0.18);border:none;color:#fff;border-radius:7px;padding:6px 10px;font-size:20px;cursor:pointer;flex-shrink:0;line-height:1;}

/* SCREENS */
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
.screen.active{display:flex;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* LIST ITEMS */
.list-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--br);background:var(--bg);cursor:pointer;transition:background .12s;}
.list-item:active{background:var(--bg2);}
.item-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.ic-kunde{background:#E6F1FB;}
.ic-wohnung{background:#EAF3DE;}
.ic-klappe{background:#FAEEDA;}
.ic-klappe.nok{background:#FCEBEB;}
.ic-klappe.ok{background:#EAF3DE;}
.item-body{flex:1;min-width:0;}
.item-title{font-size:15px;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-sub{font-size:12px;color:var(--tx3);margin-top:2px;}
.item-arrow{color:var(--tx3);font-size:18px;flex-shrink:0;}
.item-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;flex-shrink:0;}
.badge-ok{background:var(--gl);color:var(--g);}
.badge-nok{background:var(--rl);color:var(--r);}
.badge-part{background:var(--aml);color:var(--am);}
.badge-open{background:var(--bg3);color:var(--tx3);}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 24px;color:var(--tx3);}
.empty .eico{font-size:48px;margin-bottom:12px;}
.empty p{font-size:14px;line-height:1.6;}

/* FAB */
.fab{position:fixed;bottom:calc(20px + var(--sb));right:calc(50% - 270px + 14px);width:56px;height:56px;border-radius:28px;background:var(--g);color:#fff;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.25);z-index:50;}
@media(max-width:540px){.fab{right:14px;}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--bg);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + var(--sb));width:100%;max-width:540px;max-height:90dvh;overflow-y:auto;}
.modal h2{font-size:17px;font-weight:600;margin-bottom:16px;}
.modal-close{float:right;background:none;border:none;font-size:22px;color:var(--tx3);cursor:pointer;margin-top:-2px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;}
.field input,.field select,.field textarea{font-size:14px;font-family:inherit;padding:10px 11px;background:var(--bg2);border:1px solid var(--br2);border-radius:var(--rads);color:var(--tx);outline:none;width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gm);}
.field textarea{resize:none;height:68px;line-height:1.5;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-save{width:100%;padding:13px;background:var(--g);color:#fff;border:none;border-radius:var(--rad);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:4px;}
.btn-save:active{background:var(--gd);}
.btn-del{width:100%;padding:11px;background:var(--rl);color:var(--r);border:1px solid var(--r);border-radius:var(--rad);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;margin-top:8px;}

/* KLAPPE DETAIL */
.klappe-header{padding:14px;background:var(--bg2);border-bottom:1px solid var(--br);}
.klappe-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.km-item{background:var(--bg);border-radius:8px;padding:8px 10px;border:1px solid var(--br);}
.km-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;font-weight:500;}
.km-val{font-size:13px;color:var(--tx);margin-top:2px;font-weight:500;}

/* TABS */
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--br);flex-shrink:0;}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:12px;font-weight:500;color:var(--tx3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--g);border-bottom-color:var(--g);}

/* STATUS BAR */
.sbar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--bg2);border-bottom:1px solid var(--br);flex-shrink:0;flex-wrap:wrap;}
.stat{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--tx2);}
.dot{width:7px;height:7px;border-radius:50%;}
.dok{background:var(--gm);} .dnok{background:#E24B4A;} .dna{background:#378ADD;} .dopen{background:var(--tx3);}
.pbar{flex:1;min-width:40px;height:4px;background:var(--bg3);border-radius:2px;}
.pfill{height:100%;background:var(--gm);border-radius:2px;transition:width .3s;}

/* CHECKLIST */
.sec-hdr{padding:7px 14px 5px;background:var(--bg2);border-top:1px solid var(--br);border-bottom:1px solid var(--br);}
.sec-hdr h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);}
.ci{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--br);background:var(--bg);}
.ci-text{flex:1;min-width:0;}
.ci-main{font-size:13px;color:var(--tx);line-height:1.3;}
.ci-sub{font-size:11px;color:var(--tx3);margin-top:2px;}
.tri{display:flex;gap:3px;flex-shrink:0;}
.tri button{width:32px;height:32px;border-radius:6px;border:1px solid var(--br2);background:var(--bg2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;color:var(--tx2);}
.tri .bok.on{background:var(--gl);border-color:var(--gm);color:var(--g);}
.tri .bnok.on{background:var(--rl);border-color:#E24B4A;color:var(--r);}
.tri .bna.on{background:var(--bl);border-color:#378ADD;color:var(--b);}

/* PHOTOS */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px;}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg3);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.photo-add{aspect-ratio:1;border-radius:8px;border:2px dashed var(--br2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--bg2);color:var(--tx3);font-size:11px;gap:4px;}
.photo-add .pico{font-size:26px;}
input[type=file]{display:none;}

/* BOTTOM BAR */
.bbar{background:var(--bg);border-top:1px solid var(--br);padding:10px 14px calc(10px + var(--sb));display:flex;gap:8px;flex-shrink:0;}
.bsec{flex:1;padding:12px 8px;background:var(--bg2);border:1px solid var(--br2);border-radius:var(--rad);font-size:14px;font-family:inherit;color:var(--tx);cursor:pointer;font-weight:500;}
.bmain{flex:2.5;padding:12px 8px;background:var(--g);border:none;border-radius:var(--rad);font-size:14px;font-family:inherit;color:#fff;cursor:pointer;font-weight:600;}
.bmain:active{background:var(--gd);}

/* PROTOCOL VIEW */
.proto-view{padding:14px 14px calc(120px + var(--sb));}
.proto-hero{text-align:center;padding:16px 0 12px;}
.proto-hero h2{font-size:20px;font-weight:700;}
.pbadge{display:inline-block;padding:5px 18px;border-radius:20px;font-size:13px;font-weight:600;margin-top:6px;}
.pcard{background:var(--bg2);border-radius:var(--rad);padding:11px 13px;margin-bottom:10px;border:1px solid var(--br);}
.prow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0;}
.plbl{color:var(--tx2);}
.ri-ok{color:var(--g);font-weight:600;} .ri-nok{color:var(--r);font-weight:600;} .ri-na{color:var(--b);font-weight:600;} .ri-open{color:var(--tx3);font-weight:600;}
.proto-sec-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin-bottom:6px;}
.ract{width:100%;padding:13px;border-radius:var(--rad);font-size:15px;font-family:inherit;font-weight:600;cursor:pointer;margin-bottom:8px;border:1px solid var(--br2);background:var(--bg2);color:var(--tx);}
.ract.primary{background:var(--g);border-color:transparent;color:#fff;}
.ract.primary:active{background:var(--gd);}
.proto-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.proto-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;}
</style>
</head>
<body>
<div class="app">

<!-- ═══ SCREEN 1: KUNDEN ═══ -->
<div id="s1" class="screen active">
  <div class="hdr">
    <div class="hdr-info">
      <h1>🔥 BSK Prüfprotokoll</h1>
      <p>Bartoska Gebäudereinigung · VDI 6022</p>
    </div>
    <button class="hdr-add" onclick="openNewKunde()" title="Kunde hinzufügen">＋</button>
  </div>
  <div class="scroll" id="kundenList"></div>
</div>

<!-- ═══ SCREEN 2: WOHNUNGEN/RÄUME ═══ -->
<div id="s2" class="screen">
  <div class="hdr">
    <button class="hdr-back" onclick="goBack(1)">‹ Zurück</button>
    <div class="hdr-info">
      <h1 id="s2title">Objekte</h1>
      <p id="s2sub">Wohnungen / Räume</p>
    </div>
    <button class="hdr-add" onclick="openNewWohnung()" title="Raum hinzufügen">＋</button>
  </div>
  <div class="scroll" id="wohnList"></div>
</div>

<!-- ═══ SCREEN 3: KLAPPEN ═══ -->
<div id="s3" class="screen">
  <div class="hdr">
    <button class="hdr-back" onclick="goBack(2)">‹ Zurück</button>
    <div class="hdr-info">
      <h1 id="s3title">Klappen</h1>
      <p id="s3sub"></p>
    </div>
    <button class="hdr-add" onclick="openEditWohnung()" title="Raum bearbeiten" style="font-size:15px;padding:6px 10px;">✎</button>
    <button class="hdr-add" onclick="openNewKlappe()" title="Klappe hinzufügen">＋</button>
  </div>
  <div class="scroll" id="klapList"></div>
</div>

<!-- ═══ SCREEN 4: KLAPPE DETAIL ═══ -->
<div id="s4" class="screen">
  <div class="hdr">
    <button class="hdr-back" onclick="goBack(3)">‹ Zurück</button>
    <div class="hdr-info">
      <h1 id="s4title">Prüfung</h1>
      <p id="s4sub"></p>
    </div>
    <button class="hdr-add" onclick="openKlappeEditModal()" title="Bearbeiten" style="font-size:15px;padding:6px 10px;">✎</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('pruef')">✔ Prüfung</button>
    <button class="tab" onclick="switchTab('fotos')">📷 Fotos</button>
    <button class="tab" onclick="switchTab('notizen')">📝 Notizen</button>
  </div>
  <div id="tabPruef" class="tab-content" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
    <div class="sbar">
      <div class="stat"><div class="dot dok"></div><span id="cOk">0</span> i.O.</div>
      <div class="stat"><div class="dot dnok"></div><span id="cNok">0</span> n.i.O.</div>
      <div class="stat"><div class="dot dna"></div><span id="cNa">0</span> n.z.</div>
      <div class="stat"><div class="dot dopen"></div><span id="cOpen">0</span> offen</div>
      <div class="pbar"><div class="pfill" id="pFill" style="width:0%"></div></div>
    </div>
    <div class="scroll" id="checkBody"></div>
  </div>
  <div id="tabFotos" class="tab-content" style="display:none;flex:1;overflow-y:auto;">
    <div class="photo-grid" id="photoGrid">
      <label class="photo-add" for="photoInput">
        <span class="pico">📷</span><span>Foto hinzufügen</span>
      </label>
    </div>
    <input type="file" id="photoInput" accept="image/*" multiple onchange="addPhotos(event)">
  </div>
  <div id="tabNotizen" class="tab-content" style="display:none;flex:1;overflow-y:auto;padding:14px;">
    <div class="field"><label>Mängelbeschreibung</label><textarea id="fMaengel" placeholder="Mängel, Besonderheiten ..."></textarea></div>
    <div class="field"><label>Empfohlene Maßnahmen</label><textarea id="fMassnahmen" placeholder="z.B. Schmelzlot tauschen bis ..."></textarea></div>
    <div class="field"><label>Schließzeit (gemessen)</label><input type="text" id="fSchliesszeit" placeholder="z.B. 4,2 s"></div>
  </div>
  <div class="bbar">
    <button class="bsec" onclick="openProtokoll()">Protokoll</button>
    <button class="bmain" onclick="saveKlappeDaten();goBack(3)">Speichern ✓</button>
  </div>
</div>

<!-- ═══ SCREEN 5: PROTOKOLL (Kunde komplett) ═══ -->
<div id="s5" class="screen">
  <div class="hdr">
    <button class="hdr-back" onclick="goBack(2)">‹ Zurück</button>
    <div class="hdr-info">
      <h1>Gesamtprotokoll</h1>
      <p id="s5sub"></p>
    </div>
  </div>
  <div class="scroll">
    <div class="proto-view" id="protoContent"></div>
  </div>
  <div class="bbar">
    <button class="bsec" onclick="shareAll()">Teilen ↗</button>
    <button class="bmain" onclick="printAll()">Drucken / PDF 🖨</button>
  </div>
</div>

<!-- ═══ MODALS ═══ -->
<!-- Kunde -->
<div class="modal-overlay hidden" id="mkunde">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('mkunde')">✕</button>
    <h2>Kunde hinzufügen</h2>
    <div class="field"><label>Kundenname / Firma</label><input type="text" id="mKName" placeholder="z.B. Mustermann Immobilien GmbH"></div>
    <div class="field"><label>Adresse des Objekts</label><input type="text" id="mKAdresse" placeholder="z.B. Musterstraße 5, 8010 Graz"></div>
    <div class="field"><label>Ansprechpartner</label><input type="text" id="mKKontakt" placeholder="Name, Tel oder E-Mail"></div>
    <div class="field-row">
      <div class="field"><label>Prüfdatum</label><input type="date" id="mKDatum"></div>
      <div class="field"><label>Prüfer</label><input type="text" id="mKPruefer" placeholder="Techniker"></div>
    </div>
    <div class="field"><label>Nächste Prüfung fällig</label><input type="date" id="mKNaechste"></div>
    <button class="btn-save" onclick="saveKunde()">Kunde speichern</button>
    <button class="btn-del" id="mKDelBtn" onclick="deleteKunde()" style="display:none">Kunde löschen</button>
  </div>
</div>

<!-- Wohnung/Raum -->
<div class="modal-overlay hidden" id="mwohnung">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('mwohnung')">✕</button>
    <h2>Wohnung / Raum hinzufügen</h2>
    <div class="field"><label>Bezeichnung</label><input type="text" id="mWName" placeholder="z.B. Wohnung Top 3, EG Technikraum, Keller"></div>
    <div class="field"><label>Lage / Stockwerk</label><input type="text" id="mWLage" placeholder="z.B. 2. OG, Erdgeschoss"></div>
    <div class="field"><label>Nutzung</label>
      <select id="mWNutzung">
        <option value="">— auswählen —</option>
        <option>Wohnung</option><option>Büro</option><option>Technikraum</option><option>Keller</option>
        <option>Stiegenhaus</option><option>Lager</option><option>Gastronomie</option><option>Sonstiges</option>
      </select>
    </div>
    <div class="field"><label>Bemerkung</label><input type="text" id="mWBem" placeholder="Optional"></div>
    <button class="btn-save" onclick="saveWohnung()">Raum speichern</button>
    <button class="btn-del" id="mWDelBtn" onclick="deleteWohnung()" style="display:none">Raum löschen</button>
  </div>
</div>

<!-- Klappe -->
<div class="modal-overlay hidden" id="mklappe">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('mklappe')">✕</button>
    <h2>Brandschutzklappe hinzufügen</h2>
    <div class="field-row">
      <div class="field"><label>Klappe Nr. / ID</label><input type="text" id="mKlNr" placeholder="z.B. BSK-01"></div>
      <div class="field"><label>Nennmaß (B×H)</label><input type="text" id="mKlNennmass" placeholder="200×200 mm"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Feuerwiderstandskl.</label>
        <select id="mKlFwk"><option value="">—</option><option>EI 30</option><option>EI 60</option><option>EI 90</option><option>EI 120</option></select>
      </div>
      <div class="field"><label>Auslösetemperatur</label>
        <select id="mKlAusloese"><option value="">—</option><option>72 °C</option><option>95 °C</option><option>elektrisch/BMA</option></select>
      </div>
    </div>
    <div class="field"><label>Einbauort genau</label><input type="text" id="mKlEinbau" placeholder="z.B. Wand Nord, Decke Bad"></div>
    <div class="field"><label>Hersteller / Typ</label><input type="text" id="mKlHersteller" placeholder="z.B. Trox FKA-EU"></div>
    <button class="btn-save" onclick="saveKlappe()">Klappe speichern</button>
    <button class="btn-del" id="mKlDelBtn" onclick="deleteKlappe()" style="display:none">Klappe löschen</button>
  </div>
</div>

<!-- Klappe Edit (gleich wie mklappe aber für bestehende) -->
<div class="modal-overlay hidden" id="mklappeEdit">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('mklappeEdit')">✕</button>
    <h2>Klappe bearbeiten</h2>
    <div class="field-row">
      <div class="field"><label>Klappe Nr. / ID</label><input type="text" id="eKlNr"></div>
      <div class="field"><label>Nennmaß (B×H)</label><input type="text" id="eKlNennmass"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Feuerwiderstandskl.</label>
        <select id="eKlFwk"><option value="">—</option><option>EI 30</option><option>EI 60</option><option>EI 90</option><option>EI 120</option></select>
      </div>
      <div class="field"><label>Auslösetemperatur</label>
        <select id="eKlAusloese"><option value="">—</option><option>72 °C</option><option>95 °C</option><option>elektrisch/BMA</option></select>
      </div>
    </div>
    <div class="field"><label>Einbauort genau</label><input type="text" id="eKlEinbau"></div>
    <div class="field"><label>Hersteller / Typ</label><input type="text" id="eKlHersteller"></div>
    <button class="btn-save" onclick="saveKlappeEdit()">Änderungen speichern</button>
    <button class="btn-del" onclick="deleteKlappeCurrent()" style="display:block">Klappe löschen</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// DATA
// ═══════════════════════════════════════

function renderKunden(){
  const el=document.getElementById('kundenList');
  if(!DB.kunden.length){el.innerHTML=`<div class="empty"><div class="eico">🏢</div><p>Noch kein Kunde angelegt.<br>Tippe auf <strong>+</strong> um einen Kunden hinzuzufügen.</p></div>`;return;}
  el.innerHTML=DB.kunden.map(k=>{
    const stats=kundeStats(k);
    const badge=statBadge(stats);
    return `<div class="list-item" onclick="openKunde('${k.id}')">
      <div class="item-icon ic-kunde">🏢</div>
      <div class="item-body">
        <div class="item-title">${k.name}</div>
        <div class="item-sub">${k.adresse||''}${k.datum?' · '+k.datum:''}</div>
      </div>
      ${badge}
      <div class="item-arrow">›</div>
    </div>`;
  }).join('');
}

function kundeStats(k){
  let ok=0,nok=0,na=0,open=0,total=0;
  (k.wohnungen||[]).forEach(w=>{
    (w.klappen||[]).forEach(kl=>{
      const s=klStats(kl);ok+=s.ok;nok+=s.nok;na+=s.na;open+=s.open;total+=s.total;
    });
  });
  return{ok,nok,na,open,total};
}

function klStats(kl){
  const st=kl.state||{};
  let ok=0,nok=0,na=0,open=0;
  SECS.forEach(s=>s.items.forEach(i=>{const v=st[i.id]||'open';if(v==='ok')ok++;else if(v==='nok')nok++;else if(v==='na')na++;else open++;}));
  const total=ok+nok+na+open;
  return{ok,nok,na,open,total};
}

function statBadge(s){
  if(!s.total)return`<span class="item-badge badge-open">Neu</span>`;
  if(s.nok>0)return`<span class="item-badge badge-nok">✗ ${s.nok} n.i.O.</span>`;
  if(s.open>0)return`<span class="item-badge badge-part">${Math.round((s.ok+s.nok+s.na)/s.total*100)}%</span>`;
  return`<span class="item-badge badge-ok">✓ Bestanden</span>`;
}

// CHECKLIST
// ═══════════════════════════════════════
function buildChecklist(kl){
  const body=document.getElementById('checkBody');
  body.innerHTML='';
  if(!kl.state)kl.state={};
  SECS.forEach(sec=>{
    const wrap=document.createElement('div');
    const hdr=document.createElement('div');hdr.className='sec-hdr';hdr.innerHTML=`<h3>${sec.title}</h3>`;wrap.appendChild(hdr);
    sec.items.forEach(item=>{
      if(!kl.state[item.id])kl.state[item.id]='open';
      const row=document.createElement('div');row.className='ci';
      row.innerHTML=`<div class="ci-text"><div class="ci-main">${item.t}</div>${item.s?`<div class="ci-sub">${item.s}</div>`:''}</div>
        <div class="tri">
          <button class="bok ${kl.state[item.id]==='ok'?'on':''}" onclick="setCheck('${item.id}','ok',this)">✓</button>
          <button class="bnok ${kl.state[item.id]==='nok'?'on':''}" onclick="setCheck('${item.id}','nok',this)">✗</button>
          <button class="bna ${kl.state[item.id]==='na'?'on':''}" onclick="setCheck('${item.id}','na',this)">—</button>
        </div>`;
      wrap.appendChild(row);
    });
    body.appendChild(wrap);
  });
  updateStats();
}

function setCheck(id,val,btn){
  const kl=getKlappe();
  kl.state[id]=kl.state[id]===val?'open':val;
  btn.closest('.tri').querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  if(kl.state[id]!=='open')btn.classList.add('on');
  updateStats();
}

function updateStats(){
  const kl=getKlappe();
  const s=klStats(kl);
  document.getElementById('cOk').textContent=s.ok;
  document.getElementById('cNok').textContent=s.nok;
  document.getElementById('cNa').textContent=s.na;
  document.getElementById('cOpen').textContent=s.open;
  document.getElementById('pFill').style.width=s.total?Math.round((s.ok+s.nok+s.na)/s.total*100)+'%':'0%';
}

function buildPhotos(kl){
  const grid=document.getElementById('photoGrid');
  let html='';
  (kl.photos||[]).forEach((p,i)=>{
    html+=`<div class="photo-thumb"><img src="${p}" loading="lazy"><button class="photo-del" onclick="delPhoto(${i})">✕</button></div>`;
  });
  html+=`<label class="photo-add" for="photoInput"><span class="pico">📷</span><span>Foto hinzufügen</span></label>`;
  grid.innerHTML=html;
}

function addPhotos(evt){
  const kl=getKlappe();
  if(!kl.photos)kl.photos=[];
  const files=Array.from(evt.target.files);
  let done=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{kl.photos.push(e.target.result);done++;if(done===files.length)buildPhotos(kl);};
    reader.readAsDataURL(file);
  });
  evt.target.value='';
}

function delPhoto(i){
  const kl=getKlappe();
  kl.photos.splice(i,1);buildPhotos(kl);
}

  showScreen(5);
}

function openGesamtProtokollFuerWohnung(){
  const k=getKunde();
  const w=getWohn();
  document.getElementById('s5sub').textContent=k.name+' · '+w.name;
  buildGesamtProtokoll(k,[cur.wohnId]);
  showScreen(5);
}

function buildGesamtProtokoll(k,wohnFilter){
  const wohnungen=(k.wohnungen||[]).filter(w=>!wohnFilter||wohnFilter.includes(w.id));
  let html='';
  // Hero
  const totalStats={ok:0,nok:0,na:0,open:0,total:0};
  wohnungen.forEach(w=>(w.klappen||[]).forEach(kl=>{const s=klStats(kl);totalStats.ok+=s.ok;totalStats.nok+=s.nok;totalStats.na+=s.na;totalStats.open+=s.open;totalStats.total+=s.total;}));
  const gesBadge=totalStats.nok>0?`<span class="pbadge" style="background:var(--rl);color:var(--r)">⚠ Mängel festgestellt</span>`:
    totalStats.open>0?`<span class="pbadge" style="background:var(--aml);color:var(--am)">◎ Unvollständig</span>`:
    `<span class="pbadge" style="background:var(--gl);color:var(--g)">✓ Bestanden</span>`;
  html+=`<div class="proto-hero"><h2>Gesamtprotokoll</h2>${gesBadge}</div>`;
  // Kundendaten
  html+=`<div class="pcard"><div class="proto-sec-lbl">Kundendaten</div>
    <div class="prow"><span class="plbl">Kunde</span><span>${k.name}</span></div>
    <div class="prow"><span class="plbl">Adresse</span><span>${k.adresse||'—'}</span></div>
    <div class="prow"><span class="plbl">Ansprechpartner</span><span>${k.kontakt||'—'}</span></div>
    <div class="prow"><span class="plbl">Prüfdatum</span><span>${k.datum||'—'}</span></div>
    <div class="prow"><span class="plbl">Prüfer</span><span>${k.pruefer||'—'}</span></div>
    <div class="prow"><span class="plbl">Nächste Prüfung</span><span>${k.naechste||'—'}</span></div>
  </div>`;
  // Gesamtstatistik
  html+=`<div class="pcard"><div class="proto-sec-lbl">Gesamtergebnis</div>
    <div class="prow"><span class="plbl">Räume / Einheiten</span><span>${wohnungen.length}</span></div>
    <div class="prow"><span class="plbl">Klappen gesamt</span><span>${wohnungen.reduce((a,w)=>a+(w.klappen||[]).length,0)}</span></div>
    <div class="prow"><span class="plbl">In Ordnung (i.O.)</span><span class="ri-ok">✓ ${totalStats.ok}</span></div>
    <div class="prow"><span class="plbl">Nicht in Ordnung (n.i.O.)</span><span class="ri-nok">✗ ${totalStats.nok}</span></div>
    <div class="prow"><span class="plbl">Nicht zutreffend (n.z.)</span><span class="ri-na">— ${totalStats.na}</span></div>
    <div class="prow"><span class="plbl">Offen / nicht geprüft</span><span class="ri-open">? ${totalStats.open}</span></div>
  </div>`;
  // Je Wohnung
  wohnungen.forEach(w=>{
    const kls=w.klappen||[];
    html+=`<div class="pcard"><div class="proto-sec-lbl">🏠 ${w.name} ${w.lage?'· '+w.lage:''}</div>`;
    if(!kls.length){html+=`<div class="prow"><span class="plbl">Keine Klappen erfasst</span></div>`;}
    kls.forEach(kl=>{
      const s=klStats(kl);
      const col=s.nok>0?'var(--r)':s.open>0?'var(--am)':'var(--g)';
      const icon=s.nok>0?'✗':s.open>0?'?':'✓';
      html+=`<div style="border:1px solid var(--br);border-radius:8px;padding:8px 10px;margin-bottom:6px;">
        <div class="prow" style="font-weight:500;"><span>${kl.nr} ${kl.nennmass?'· '+kl.nennmass:''}</span><span style="color:${col}">${icon} ${s.nok>0?s.nok+' n.i.O.':s.open>0?s.open+' offen':'Bestanden'}</span></div>
        ${kl.fwk||kl.ausloese||kl.einbau?`<div style="font-size:11px;color:var(--tx3);margin-top:2px;">${[kl.fwk,kl.ausloese,kl.einbau].filter(Boolean).join(' · ')}</div>`:''}
        ${kl.schliesszeit?`<div class="prow"><span class="plbl">Schließzeit</span><span>${kl.schliesszeit}</span></div>`:''}
        ${s.nok>0?`<div style="margin-top:6px;">`+SECS.map(sec=>sec.items.filter(i=>(kl.state||{})[i.id]==='nok').map(i=>`<div style="font-size:11px;color:var(--r);padding:2px 0;">✗ ${i.t}</div>`).join('')).join('')+`</div>`:''}
        ${kl.maengel?`<div style="font-size:12px;color:var(--tx2);margin-top:4px;padding:4px 6px;background:var(--rl);border-radius:4px;">${kl.maengel}</div>`:''}
        ${kl.massnahmen?`<div style="font-size:12px;color:var(--tx2);margin-top:4px;padding:4px 6px;background:var(--aml);border-radius:4px;">${kl.massnahmen}</div>`:''}
        ${(kl.photos||[]).length?`<div class="proto-photos">${kl.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('protoContent').innerHTML=html;
}

function printAll(){
  const k=getKunde();
  const wohnungen=k.wohnungen||[];
  let tableRows='';
  wohnungen.forEach(w=>{
    tableRows+=`<tr><td colspan="2" style="background:#EDECE8;font-weight:700;padding:6px 8px;font-size:9pt;">🏠 ${w.name} ${w.lage?'· '+w.lage:''} ${w.nutzung?'('+w.nutzung+')':''}</td></tr>`;
    (w.klappen||[]).forEach(kl=>{
      tableRows+=`<tr><td colspan="2" style="background:#F6F5F2;padding:5px 8px;font-size:9pt;font-weight:600;">🔧 ${kl.nr} ${kl.nennmass?'· '+kl.nennmass:''} ${kl.fwk?'· '+kl.fwk:''} ${kl.einbau?'· '+kl.einbau:''}</td></tr>`;
      if(kl.schliesszeit)tableRows+=`<tr><td colspan="2" style="padding:3px 8px;font-size:8pt;color:#555;">Schließzeit: ${kl.schliesszeit}</td></tr>`;
      SECS.forEach(sec=>{
        let secHasItems=false;
        const rows=sec.items.map(item=>{
          const s=(kl.state||{})[item.id]||'open';
          const icon=s==='ok'?'✓ i.O.':s==='nok'?'✗ n.i.O.':s==='na'?'— n.z.':'? offen';
          const col=s==='ok'?'#27500A':s==='nok'?'#A32D2D':s==='na'?'#0C447C':'#888';
          if(!secHasItems){secHasItems=true;}
          return `<tr><td style="padding:4px 8px 4px 16px;font-size:8pt;border-bottom:.5px solid #e5e5e5;">${item.t}${item.s?` <span style="color:#aaa">(${item.s})</span>`:''}</td><td style="padding:4px 8px;font-size:8pt;font-weight:600;color:${col};text-align:right;white-space:nowrap;border-bottom:.5px solid #e5e5e5;">${icon}</td></tr>`;
        }).join('');
        tableRows+=`<tr><td colspan="2" style="padding:4px 8px;background:#f8f8f6;font-size:8pt;font-weight:600;color:#555;">${sec.title}</td></tr>${rows}`;
      });
      const nokItems=SECS.flatMap(sec=>sec.items.filter(i=>(kl.state||{})[i.id]==='nok'));
      if(nokItems.length){tableRows+=`<tr><td colspan="2" style="padding:4px 8px;font-size:8pt;color:#A32D2D;font-weight:600;">Mängel: ${nokItems.map(i=>i.t).join(' | ')}</td></tr>`;}
      if(kl.maengel)tableRows+=`<tr><td colspan="2" style="padding:4px 8px;font-size:8pt;background:#FCEBEB;color:#A32D2D;">Bemerkung: ${kl.maengel}</td></tr>`;
      if(kl.massnahmen)tableRows+=`<tr><td colspan="2" style="padding:4px 8px;font-size:8pt;background:#FAEEDA;color:#854F0B;">Maßnahmen: ${kl.massnahmen}</td></tr>`;
      // Fotos
      if((kl.photos||[]).length){
        const fotosCells=kl.photos.map(p=>`<td><img src="${p}" style="width:80px;height:80px;object-fit:cover;border-radius:4px;"></td>`).join('');
        tableRows+=`<tr><td colspan="2" style="padding:6px 8px;"><table><tr>${fotosCells}</tr></table></td></tr>`;
      }
    });
  });

  const totalStats={ok:0,nok:0,na:0,open:0};
  wohnungen.forEach(w=>(w.klappen||[]).forEach(kl=>{const s=klStats(kl);totalStats.ok+=s.ok;totalStats.nok+=s.nok;totalStats.na+=s.na;totalStats.open+=s.open;}));
  const gesamt=totalStats.nok>0?'MÄNGEL FESTGESTELLT':totalStats.open>0?'UNVOLLSTÄNDIG':'BESTANDEN';
  const gesamtColor=totalStats.nok>0?'#A32D2D':totalStats.open>0?'#854F0B':'#27500A';

  const html=`<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
  <title>BSK-Protokoll ${k.name}</title>
  <style>body{font-family:Arial,sans-serif;font-size:10pt;color:#1a1a1a;max-width:800px;margin:20px auto;padding:0 16px;}
  h1{font-size:15pt;font-weight:700;margin-bottom:2px;}h2{font-size:10pt;font-weight:400;color:#555;}
  .badge{display:inline-block;padding:4px 14px;border-radius:4px;font-weight:700;color:#fff;background:${gesamtColor};margin-bottom:12px;}
  .meta{width:100%;border-collapse:collapse;margin-bottom:14px;}
  .meta td{padding:4px 8px;font-size:9pt;border-bottom:.5px solid #ddd;}
  .meta .l{color:#666;width:130px;}
  table.checks{width:100%;border-collapse:collapse;}
  .footer{margin-top:20px;padding-top:8px;border-top:.5px solid #ccc;display:flex;justify-content:space-between;font-size:8pt;color:#aaa;}
  .sig{margin-top:28px;display:flex;gap:40px;}
  .sig-box{flex:1;border-top:1px solid #555;padding-top:4px;font-size:8pt;color:#555;}
  @media print{@page{margin:1cm 1.5cm;}}</style></head><body>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
    <div><h1>🔥 Brandschutzklappe — Prüfprotokoll</h1><h2>ÖNORM EN 1366-2 / VDI 6022 / OIB-RL 2</h2><span class="badge">${gesamt}</span></div>
    <div style="text-align:right;font-size:9pt;color:#555;"><strong>Bartoska Gebäudereinigung</strong><br>Vasoldsberg, Österreich<br>VDI 6022 zertifiziert<br>bartoska.at</div>
  </div>
  <table class="meta">
    <tr><td class="l">Kunde / Objekt:</td><td><strong>${k.name}</strong></td><td class="l">Adresse:</td><td>${k.adresse||'—'}</td></tr>
    <tr><td class="l">Ansprechpartner:</td><td>${k.kontakt||'—'}</td><td class="l">Prüfdatum:</td><td>${k.datum||'—'}</td></tr>
    <tr><td class="l">Prüfer:</td><td>${k.pruefer||'—'}</td><td class="l">Nächste Prüfung:</td><td>${k.naechste||'—'}</td></tr>
    <tr><td class="l">Räume / Einheiten:</td><td>${wohnungen.length}</td><td class="l">Klappen gesamt:</td><td>${wohnungen.reduce((a,w)=>a+(w.klappen||[]).length,0)}</td></tr>
    <tr><td class="l">Ergebnis gesamt:</td><td colspan="3" style="font-weight:700;color:${gesamtColor}">i.O.: ${totalStats.ok} | n.i.O.: ${totalStats.nok} | n.z.: ${totalStats.na} | offen: ${totalStats.open}</td></tr>
  </table>
  <table class="checks">${tableRows}</table>
  <div class="sig">
    <div class="sig-box">Ort, Datum: ___________________________</div>
    <div class="sig-box">Unterschrift Prüfer: ___________________________</div>
    <div class="sig-box">Firmenstempel:</div>
  </div>
  <div class="footer"><span>Bartoska Gebäudereinigung · Vasoldsberg · bartoska.at</span><span>Erstellt: ${new Date().toLocaleDateString('de-AT')}</span></div>
  </body></html>`;

  const win=window.open('','_blank');
  win.document.write(html);win.document.close();
  setTimeout(()=>win.print(),400);
}

function shareAll(){
  const k=getKunde();
  const wohnungen=k.wohnungen||[];
  const totalStats={ok:0,nok:0,na:0,open:0};
  wohnungen.forEach(w=>(w.klappen||[]).forEach(kl=>{const s=klStats(kl);totalStats.ok+=s.ok;totalStats.nok+=s.nok;totalStats.na+=s.na;totalStats.open+=s.open;}));
  const result=totalStats.nok>0?'⚠ MÄNGEL FESTGESTELLT':totalStats.open>0?'◎ UNVOLLSTÄNDIG':'✓ BESTANDEN';
  let text=`BSK PRÜFPROTOKOLL\nBartoska Gebäudereinigung — VDI 6022\n\nKunde: ${k.name}\nAdresse: ${k.adresse||'—'}\nPrüfdatum: ${k.datum||'—'}\nPrüfer: ${k.pruefer||'—'}\n\nErgebnis: ${result}\ni.O.: ${totalStats.ok}  |  n.i.O.: ${totalStats.nok}  |  n.z.: ${totalStats.na}  |  offen: ${totalStats.open}\n`;
  wohnungen.forEach(w=>{
    text+=`\n🏠 ${w.name}\n`;
    (w.klappen||[]).forEach(kl=>{
      const s=klStats(kl);
      text+=`  🔧 ${kl.nr}: ${s.nok>0?s.nok+' n.i.O.':s.open>0?s.open+' offen':'Bestanden'}\n`;
      if(kl.maengel)text+=`     Mängel: ${kl.maengel}\n`;
    });
  });
  text+=`\nbartoska.at`;
  if(navigator.share){navigator.share({title:`BSK-Protokoll ${k.name}`,text});}
  else{window.location.href=`mailto:?subject=${encodeURIComponent('BSK-Protokoll '+k.name)}&body=${encodeURIComponent(text)}`;}
}

function set(id,val){const el=document.getElementById(id);if(el)el.value=val||'';}
function getKunde(){return DB.kunden.find(k=>k.id===cur.kundeId)||{};}
function getWohn(){const k=getKunde();return(k.wohnungen||[]).find(w=>w.id===cur.wohnId)||{};}
function getKlappe(){const w=getWohn();return(w.klappen||[]).find(kl=>kl.id===cur.klappId)||{};}
